name: build-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: desktop/electron
        run: npm install --no-audit --no-fund

      - name: Build installer (NSIS x64)
        working-directory: desktop/electron
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: changshipin-windows-x64
          path: |
            release/changshipin-Setup-*.exe
            release/changshipin-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
