<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音视频解析 · 使用助手</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='65' font-size='50' fill='white' text-anchor='middle' font-family='sans-serif'>🎬</text></svg>">
</head>
<body>

<div id="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">🎬</div>
      <div class="brand-text">
        <h1>音视频解析 使用助手</h1>
        <p>AI 问答 · 基于完整图文教程与视频教程</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-clear" title="清空对话">🗑️</button>
      <button id="btn-theme" title="切换主题">🌙</button>
    </div>
  </header>

  <!-- 欢迎区域 -->
  <div id="welcome" class="welcome">
    <div class="welcome-icon">👋</div>
    <h2>你好，我是使用助手</h2>
    <p>关于「音视频解析」的任何问题都可以问我，我知道图文教程和视频教程的全部内容。</p>
    <div class="quick-questions">
      <div class="quick-title">试试问我：</div>
      <div class="quick-grid" id="quick-grid"></div>
    </div>
  </div>

  <!-- 对话区域 -->
  <div id="chat" class="chat hidden"></div>

  <!-- 输入区域 -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" rows="1" placeholder="输入你的问题，按 Enter 发送（Shift+Enter 换行）..."></textarea>
      <button id="send" title="发送">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="input-hint">助手基于本地知识库回答，仅供参考</div>
  </div>
</div>

<script src="knowledge.js"></script>
<script src="chat.js"></script>
</body>
</html>
