<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src http: https: blob:; connect-src http: https:;"
    />
    <title>平台官网</title>
    <link rel="stylesheet" href="platform.css" />
  </head>
  <body>
    <header class="bar">
      <div class="nav">
        <button id="btn-back" class="nav-btn" title="后退 (Alt+←)">←</button>
        <button id="btn-forward" class="nav-btn" title="前进 (Alt+→)">→</button>
        <button id="btn-reload" class="nav-btn" title="刷新 (F5)">⟳</button>
        <button id="btn-home" class="nav-btn" title="回到首页">⌂</button>
      </div>
      <div class="brand">
        <img id="brand-icon" class="brand-icon" src="assets/platform-iqiyi.png" alt="" />
        <span id="brand-name">爱奇艺</span>
      </div>
      <div class="address">
        <input id="address" type="text" spellcheck="false" placeholder="输入网址，回车打开" />
        <span class="page-badge" id="page-badge">首页</span>
      </div>
      <div class="search-mini">
        <input id="search-box" type="text" spellcheck="false" placeholder="搜索本站剧集" />
        <button id="btn-search" class="act" title="在本平台搜索">搜</button>
      </div>
      <div class="actions">
        <label class="auto" title="点开某一集/视频页时自动送到主界面解析">
          <input type="checkbox" id="auto-parse" />
          <span>自动解析</span>
        </label>
        <button id="btn-copy" class="act" title="复制当前剧集链接">复制本集</button>
        <button id="btn-parse" class="act primary" title="把本集送到主界面解析播放">解析本集</button>
        <button id="btn-external" class="act" title="用系统浏览器打开">浏览器</button>
      </div>
    </header>
    <div class="progress" id="progress" hidden></div>
    <div class="browser" id="browser">
      <div class="hint" id="hint">
        <p>正在打开官网…</p>
      </div>
    </div>
    <script src="platform.js"></script>
  </body>
</html>
