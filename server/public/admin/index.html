<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>音视频解析 · 数据后台</title>
    <link rel="icon" type="image/png" href="app-icon.png" />
    <link rel="apple-touch-icon" href="app-icon.png" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="login-wrap" id="login-view">
      <form class="login-card" id="login-form">
        <img class="login-logo" src="app-icon.png" alt="" />
        <h1>音视频解析 · 数据后台</h1>
        <p class="muted">仅管理员账号可以登录</p>
        <label>邮箱 / 用户名<input id="login-account" autocomplete="username" required /></label>
        <label>密码<input id="login-password" type="password" autocomplete="current-password" required /></label>
        <button class="primary" type="submit">登录</button>
        <p class="error" id="login-error"></p>
      </form>
    </div>

    <div id="app-view" hidden>
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-badge" src="app-icon.png" alt="" />
          <div>
            <strong>数据后台</strong>
            <span>音视频解析</span>
          </div>
        </div>
        <nav id="nav">
          <button data-page="overview" class="active">实时概览</button>
          <button data-page="trend">趋势分析</button>
          <button data-page="platforms">平台分布</button>
          <button data-page="content">解析内容</button>
          <button data-page="users">用户分析</button>
          <button data-page="feedback">反馈中心</button>
          <button data-page="quality">质量与错误</button>
        </nav>
        <div class="sidebar-foot">
          <span id="admin-name">—</span>
          <button id="btn-logout">退出登录</button>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <h2 id="page-title">实时概览</h2>
            <p class="sub" id="page-sub">每 30 秒自动刷新</p>
          </div>
          <div class="range">
            <span id="days-group">
              <button data-days="7">7 天</button>
              <button data-days="30" class="active">30 天</button>
              <button data-days="90">90 天</button>
            </span>
            <button id="btn-refresh">刷新</button>
          </div>
        </header>

        <section class="page" id="page-overview">
          <div class="cards" id="ov-cards"></div>
          <div class="grid-2">
            <div class="panel">
              <h3>今日事件量</h3>
              <div class="bars" id="ov-events"></div>
            </div>
            <div class="panel">
              <h3>客户端版本分布</h3>
              <p class="panel-sub">近 7 天有心跳的设备</p>
              <div id="ov-versions"></div>
            </div>
          </div>
          <div class="panel">
            <h3>近 7 天活跃与解析</h3>
            <div class="legend" id="ov-spark-legend"></div>
            <div class="chart" id="ov-spark"></div>
          </div>
        </section>

        <section class="page" id="page-trend" hidden>
          <div class="panel">
            <h3>趋势</h3>
            <div class="legend" id="trend-legend"></div>
            <div class="chart" id="trend-chart"></div>
          </div>
          <div class="panel">
            <h3>每日明细</h3>
            <div id="trend-table"></div>
          </div>
        </section>

        <section class="page" id="page-platforms" hidden>
          <div class="panel">
            <h3>各平台事件量</h3>
            <div class="bars" id="plat-bars"></div>
          </div>
          <div class="panel">
            <h3>平台成功率明细</h3>
            <div id="plat-table"></div>
          </div>
        </section>

        <section class="page" id="page-content" hidden>
          <div class="panel">
            <h3>解析域名 Top 20</h3>
            <div id="content-hosts"></div>
          </div>
          <div class="panel">
            <h3>视频 / 歌曲标题 Top 30</h3>
            <div id="content-titles"></div>
          </div>
          <div class="panel">
            <h3>音乐搜索词 Top 20</h3>
            <div id="content-keywords"></div>
          </div>
        </section>

        <section class="page" id="page-users" hidden>
          <div class="cards" id="user-cards"></div>
          <div class="grid-2">
            <div class="panel">
              <h3>注册漏斗</h3>
              <div class="bars" id="user-funnel"></div>
            </div>
            <div class="panel">
              <h3>活跃天数分布</h3>
              <p class="panel-sub">近 30 天登录过并产生事件的用户</p>
              <div class="bars" id="user-activity"></div>
            </div>
          </div>
          <div class="panel">
            <h3>注册趋势</h3>
            <div class="chart" id="user-signups"></div>
          </div>
          <div class="panel">
            <h3>活跃用户 Top 10</h3>
            <div id="user-top"></div>
          </div>
        </section>

        <section class="page" id="page-feedback" hidden>
          <div class="cards" id="fb-cards"></div>
          <div class="grid-2">
            <div class="panel">
              <h3>反馈趋势</h3>
              <div class="chart" id="fb-trend"></div>
            </div>
            <div class="panel">
              <h3>反馈类型</h3>
              <div class="bars" id="fb-types"></div>
            </div>
          </div>
          <div class="panel">
            <h3>反馈列表</h3>
            <div class="feedback-tools">
              <input id="fb-search" placeholder="搜索内容或邮箱…" />
              <select id="fb-status">
                <option value="">全部状态</option>
                <option value="0">待处理</option>
                <option value="1">处理中</option>
                <option value="2">已回复</option>
                <option value="3">已关闭</option>
              </select>
            </div>
            <div id="fb-list"></div>
            <div class="range" style="justify-content: flex-end; margin-top: 10px">
              <button id="fb-prev">上一页</button>
              <span class="muted" id="fb-page">—</span>
              <button id="fb-next">下一页</button>
            </div>
          </div>
        </section>

        <section class="page" id="page-quality" hidden>
          <div class="panel">
            <h3>线路类型质量</h3>
            <div id="qa-lines"></div>
          </div>
          <div class="panel">
            <h3>错误 Top 20</h3>
            <div id="qa-errors"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-mask" id="fb-modal" hidden>
      <div class="modal">
        <h3 id="fb-modal-title">反馈详情</h3>
        <div class="meta" id="fb-modal-meta"></div>
        <div class="body" id="fb-modal-body"></div>
        <div class="replies" id="fb-modal-replies"></div>
        <textarea id="fb-reply" placeholder="写回复内容，用户会在客户端的「我的反馈」里看到…"></textarea>
        <div class="row">
          <button id="fb-modal-close">关闭</button>
          <button class="primary" id="fb-send">发送回复</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="admin.js"></script>
  </body>
</html>
